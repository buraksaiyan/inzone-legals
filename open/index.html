<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Open inzone</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #0d0514; color: #fff; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    main { max-width: 520px; }
    img.icon { width: 96px; height: 96px; border-radius: 22px; }
    h1 { margin: 22px 0 8px; font-size: 2rem; }
    p { color: rgba(255,255,255,.68); }
    .stores { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
    .stores img { display: block; width: auto; height: 48px; }
  </style>
</head>
<body>
  <main>
    <img class="icon" src="/assets/images/inzone-icon.png" alt="inzone app icon">
    <h1>Open inzone</h1>
    <p>If inzone did not open automatically, install or launch it from your app store.</p>
    <div class="stores">
      <a href="https://play.google.com/store/apps/details?id=com.inzoneapp.inzone" aria-label="Get inzone on Google Play"><img src="/assets/images/get-it-on-google-play.png" alt="Get it on Google Play"></a>
      <a href="https://apps.apple.com/app/id6789995346" aria-label="Download inzone on the App Store"><img src="/assets/images/download-on-app-store.svg" alt="Download on the App Store"></a>
    </div>
  </main>
</body>
</html>
