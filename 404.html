<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#100817">
  <title>Opening inzone</title>
  <link rel="icon" href="/assets/images/inzone-icon.png">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #100817; color: #fff; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
    main { width: min(440px, 100%); }
    img { width: 88px; height: 88px; border-radius: 20px; }
    h1 { margin: 24px 0 8px; font-size: 2rem; }
    p { margin: 0 0 24px; color: rgba(255,255,255,.68); }
    a { display: inline-flex; min-height: 48px; align-items: center; justify-content: center; padding: 0 24px; border: 1px solid rgba(255,255,255,.18); border-radius: 999px; color: #fff; text-decoration: none; background: rgba(255,255,255,.08); }
  </style>
  <script>
    (function () {
      var path = window.location.pathname.toLowerCase().replace(/\/+$/, '') || '/';
      var target = '/';

      if (path === '/privacy' || path === '/privacy-policy') {
        target = '/PRIVACY_POLICY.html';
      } else if (path === '/eula' || path === '/terms' || path === '/terms-of-service') {
        target = '/EULA.html';
      } else if (path === '/delete-account' || path === '/account-deletion') {
        target = '/account-deletion.html';
      } else if (path === '/open' || path.indexOf('/open/') === 0) {
        target = '/open/';
      }

      window.location.replace(target + window.location.search + window.location.hash);
    }());
  </script>
</head>
<body>
  <main>
    <img src="/assets/images/inzone-icon.png" alt="inzone app icon">
    <h1>Opening inzone</h1>
    <p>This link is being redirected to the closest available page.</p>
    <a href="/">Go to inzone</a>
  </main>
</body>
</html>
